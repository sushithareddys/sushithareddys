<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //datatypes- different types of data(information)
        //1. string -"anything between quotes" or 'text'- simple form of text

         var city="mumbai"

         console.log(city)

         console.log("the coty name is ",city)

         //typeof(value)- method which help us to check data type 

         console.log(typeof(city))
         var password="1234"

         console.log(typeof(password))

         //2.number - positive , negative, decimals , float, all numbers

         var age=32

         var height=5.9

         var temp=-2.00

         console.log(typeof(age))
         console.log(typeof(height))
         console.log(typeof(temp))

         //3.boolean- true or false 
          var isloggedin=true
          var canwatchvideo=false
          var netflixsubscribe="true" // it is in quotes so string

           console.log(typeof(isloggedin))
            console.log(typeof(canwatchvideo))
            console.log(typeof(netflixsubscribe))


        


    </script>
</body>
</html>
