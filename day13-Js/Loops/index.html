<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>

        //loop: once the loop is started you should know how to stop the loop
        //condition is true loop starts and condition is false loop stops 
        //task print number 1 to 10 
        //console.log(1)
        //console.log(2)
        //console.log(3) ... 10 times
        //we need tyo write many times so we use for loop
        //for loop divided into 3 parts 
        //for(starting point; ending/condition;++ or --)

        // task print number 1 to 10
        // let helps to create a keyword
        for(let i=1;i<=10;i++)
        {
            console.log("The Value of",i)
        }

        //print numbers 10 to 1
        for(let y=10;y>=1;y--){
            console.log("the value is",y)
        }

        //if we dont know the starting point or ending point we use while loop
        //while loop- entry controller loop
        //while (condition): condition is true while loop starts and condition is false while loop stops 
        let count=1
        while(count<=5)
        {
            console.log("hello i am while loop")
            count++
        }

        //Do while loop - exit controlled loop
        //it will run/execute your code for one time,even if your condition is true

        let number = 7 
        do{
            console.log("hello this is do while loop")
            count--
         }
            while(number>=1)

            
        

    </script>
</body>
</html>
